name: devocional
description: "Vida devocional cristã offline-first — Bíblia ARC, leitura, recitativos e caderno de oração."
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.1

  # Estado
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Banco local (offline-first)
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  path: ^1.9.1

  # Navegação
  go_router: ^18.1.4

  # Notificações locais
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1

  # Backup / exportação
  share_plus: ^13.3.1
  file_picker: ^13.4.0

  # Utilidades
  intl: ^0.20.2
  collection: ^1.19.1
  home_widget: ^0.10.0
  supabase_flutter: ^2.18.3
  connectivity_plus: ^7.3.2
  uuid: ^4.6.0
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Geração de código (Drift + Riverpod)
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  riverpod_generator: ^4.0.10
  flutter_launcher_icons: ^0.14.4
  image: ^4.13.1

flutter:
  uses-material-design: true
  # Nenhum texto bíblico é empacotado: o usuário importa o .json no primeiro uso.
  assets:
    - assets/branding/lumen_mark.png

# Ícones do app: gere com `dart run tool/make_icons.dart` e depois `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/lumen_icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "assets/branding/lumen_icon_background.png"
  adaptive_icon_foreground: "assets/branding/lumen_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#0B1426"
