<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    Caminho em que o app é servido. Trocado pelo valor de `--base-href` no
    `flutter build web` (ex.: "/lumen/" no GitHub Pages). Precisa começar e
    terminar com "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Lumen: leitura da Bíblia, ofensiva, recitativos e caderno de oração. Funciona offline.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2453C7">

  <!-- iPhone: "Adicionar à Tela de Início" abre como app, em tela cheia. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumen">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Lumen</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B1426; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
